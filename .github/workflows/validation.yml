name: Validation
on:
  push:
    branches:
    - main
  pull_request: {}
jobs:
  syntax:
    name: Syntax and data
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
    - run: sudo apt-get update && sudo apt-get install --yes zsh
    - run: python -m py_compile scripts/sync
    - run: find src -type f \( -name '*.zsh' -o -name '*.zshrc' -o -name '*.zlogout' -o -name 
        '*.zimrc' \) -print0 | xargs -0 -r -n 1 zsh -n
    timeout-minutes: 30
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
